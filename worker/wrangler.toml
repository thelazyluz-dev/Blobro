# Cloudflare Worker config for the Blorbo global leaderboard.
# Deploy steps are in README.md. Everything here fits the free tier.

name = "blorbo-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# D1 database binding. After you run `wrangler d1 create blorbo-leaderboard`,
# Cloudflare prints a database_id — paste it below (replace PASTE_DATABASE_ID_HERE).
[[d1_databases]]
binding = "DB"                       # available in code as env.DB
database_name = "blorbo-leaderboard"
database_id = "PASTE_DATABASE_ID_HERE"

# Auth (PR 3a) config. GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are SECRETS —
# never put them here; set them with `wrangler secret put` (see README.md).
# These two [vars] are optional; both have safe code defaults (see
# worker/src/index.ts appOrigin()/sessionTtlDays()) — uncomment to override.
# [vars]
# APP_ORIGIN = "https://bl-or-bo.com"
# SESSION_TTL_DAYS = "30"
