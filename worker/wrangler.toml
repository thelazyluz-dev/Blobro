# Cloudflare Worker config for the Blorbo global leaderboard.
# Deploy steps are in README.md. Everything here fits the free tier.

name = "blorbo-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# D1 database binding. The id is just an identifier, not a credential — reaching
# the database still requires this Cloudflare account — so it lives in config
# rather than being pasted by hand on every fresh checkout.
[[d1_databases]]
binding = "DB"                       # available in code as env.DB
database_name = "blorbo-leaderboard"
database_id = "4a7a92f4-c1ff-4618-a026-bc9eb67eb3c2"

# Auth config. GOOGLE_CLIENT_SECRET is a SECRET — never put it here; set it with
# `wrangler secret put GOOGLE_CLIENT_SECRET` (see README.md).
#
# GOOGLE_CLIENT_ID is deliberately a plain var, not a secret: OAuth client IDs
# are public by design (the browser sees it in the consent URL), so keeping it
# in config means one less manual step at deploy time and one less value to lose.
[vars]
GOOGLE_CLIENT_ID = "873468822731-meo7kg4of4dn7qrephgtmhnq0n0n43s8.apps.googleusercontent.com"
APP_ORIGIN = "https://bl-or-bo.com"
SESSION_TTL_DAYS = "30"

# Nightly housekeeping (see the `scheduled` handler in src/index.ts): sweeps
# expired sessions and audit rows past their retention window. Both tables
# otherwise grow without bound, and the project's first constraint is that it
# must not cost money. 03:00 UTC — off-peak for an Israeli audience.
[triggers]
crons = ["0 3 * * *"]
