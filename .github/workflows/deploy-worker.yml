name: Deploy Worker

# Deliberately manual — a button, not a push trigger.
#
# The Worker talks to the live D1 database, so it has always been deployed by
# hand. That is the right level of control, but doing it from a laptop terminal
# has gone wrong three times in a row: run from the repo root instead of
# worker/ and wrangler tries to deploy the frontend as a new Worker; let npx
# fetch its own copy and you get wrangler 4 against a config tested on 3; miss
# the install-script prompt and the esbuild binary never downloads.
#
# None of those are possible here. The directory, the wrangler version and the
# install are fixed by this file, and it runs from a phone — GitHub's mobile
# app or the website, Actions → Deploy Worker → Run workflow.
on:
  workflow_dispatch:
    inputs:
      apply_schema:
        description: 'Also apply schema.sql first (only when a PR added tables)'
        type: boolean
        default: false

# The job only reads the repo — deploy credentials are the Cloudflare token,
# not the GITHUB_TOKEN, so the latter gets no write scope at all.
permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Don't leave the GITHUB_TOKEN sitting in .git/config while npm ci
          # runs hundreds of packages' install scripts.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The Worker bundles src/game/* through worker/src/rules.ts, so the root
      # install and typecheck are part of validating a Worker deploy, not
      # separate from it.
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Install worker toolchain
        working-directory: worker
        run: npm ci

      # Gate the deploy on the Worker's own integration tests. The manual
      # process ran no tests at all; this is the part worth adding, not just
      # the convenience.
      - name: Worker integration tests
        working-directory: worker
        run: npx vitest run

      - name: Apply schema
        if: ${{ inputs.apply_schema }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Column additions must run BEFORE schema.sql: the file indexes the new
        # column, and an index on a column the live table doesn't have yet
        # would abort the whole file. SQLite has no ADD COLUMN IF NOT EXISTS,
        # so "duplicate column" (= already applied) is tolerated explicitly —
        # any other ALTER failure still stops the deploy.
        run: |
          alter() {
            out=$(npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "$1" 2>&1) \
              || { echo "$out" | grep -q "duplicate column" && echo "already applied — fine: $1"; } \
              || { echo "$out"; exit 1; }
          }
          alter "ALTER TABLE scores ADD COLUMN cpm INTEGER NOT NULL DEFAULT 0"
          # Referral columns on users (see schema.sql). Must precede schema.sql,
          # which indexes ref_code.
          alter "ALTER TABLE users ADD COLUMN ref_code TEXT"
          alter "ALTER TABLE users ADD COLUMN referred_by TEXT"
          alter "ALTER TABLE users ADD COLUMN referral_count INTEGER NOT NULL DEFAULT 0"
          alter "ALTER TABLE users ADD COLUMN referral_claimed TEXT"
          npx wrangler d1 execute blorbo-leaderboard --remote --file=./schema.sql --yes

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # The Worker is the thing sign-in and cloud save depend on, and a bad
      # deploy makes the game unplayable rather than degraded. Check it answers
      # before calling this a success.
      - name: Post-deploy check
        run: |
          sleep 10
          node scripts/sanity.mjs https://bl-or-bo.com
