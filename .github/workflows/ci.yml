name: CI

on:
  pull_request:
  push:

# CI only reads the repo; the GITHUB_TOKEN gets no write scope.
permissions:
  contents: read

# Superseded runs on the same branch/PR cancel so we don't queue stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN sitting in .git/config while npm ci
          # runs hundreds of packages' install scripts.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # tsc -b (via the build script) is the real typecheck — `tsc --noEmit`
      # at the root is a no-op because tsconfig.json has files: [].
      - run: npm run build

      - run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
