name: CI

on:
  pull_request:
  push:

# CI only reads the repo; the GITHUB_TOKEN gets no write scope.
permissions:
  contents: read

# Superseded runs on the same branch/PR cancel so we don't queue stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Don't leave the GITHUB_TOKEN sitting in .git/config while npm ci
          # runs hundreds of packages' install scripts.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # tsc -b (via the build script) is the real typecheck — `tsc --noEmit`
      # at the root is a no-op because tsconfig.json has files: [].
      - run: npm run build

      - run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The Worker's integration tests run against a LOCAL Miniflare D1 — no cloud
  # credentials, no live database. They used to run only inside the manual
  # "Deploy Worker" workflow, which meant a PR touching auth/leaderboard/
  # anti-cheat could merge green and stay broken until someone clicked deploy.
  # Running them here closes that gap; the deploy workflow still re-runs them
  # as its own gate before wrangler deploy.
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The Worker imports the shared game core from ../src/game, so the root
      # install is part of its toolchain too.
      - run: npm ci
      - name: Install worker toolchain
        working-directory: worker
        run: npm ci
      - name: Worker integration tests
        working-directory: worker
        run: npx vitest run
