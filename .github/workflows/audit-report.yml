name: Audit Report

# Read-only look at the live database, runnable from a phone: who is flagged,
# what honest play's ratio distribution looks like, and who sails closest to
# the plausibility ceiling. This is the evidence PR 6's tuned threshold will
# be chosen from — the button exists so checking it costs a tap, not a
# terminal.
#
# Touches nothing. Every statement below is a SELECT.
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Optional: an account id to show flagged-row DETAIL for (why it flagged)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install worker toolchain
        working-directory: worker
        run: npm ci

      - name: Overview — table sizes
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "
            SELECT (SELECT COUNT(*) FROM users)      AS users,
                   (SELECT COUNT(*) FROM saves)      AS saves,
                   (SELECT COUNT(*) FROM scores)     AS board_rows,
                   (SELECT COUNT(*) FROM save_audit) AS audit_rows,
                   (SELECT COUNT(*) FROM save_audit WHERE ok = 0) AS flagged_rows;"

      # Accounts currently barred from the board (rate flags since enforcement
      # began). display_name is shown so the owner can recognise family
      # accounts; it is never shown to players.
      - name: Flagged accounts (barred from the board)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "
            SELECT a.user_id, u.display_name,
                   COUNT(*)                    AS flagged_writes,
                   GROUP_CONCAT(DISTINCT a.flags) AS flags,
                   MAX(a.created)              AS last_flagged_ms
            FROM save_audit a LEFT JOIN users u ON u.id = a.user_id
            WHERE a.ok = 0 AND a.created >= 1785715200000
              AND (',' || a.flags || ',' LIKE '%,goo-rate,%'
                OR ',' || a.flags || ',' LIKE '%,click-rate,%'
                OR ',' || a.flags || ',' LIKE '%,first-save-cap,%')
            GROUP BY a.user_id ORDER BY last_flagged_ms DESC LIMIT 25;"

      # Per-account forensics: for ONE account, every flagged write in full —
      # the numbers that explain WHY it flagged. A goo-rate row with a single
      # huge goo_gain over a short elapsed_sec (ratio just over 1) is the
      # signature of a one-time artifact — a save-format migration raising
      # lifetimeGoo, a balance/deploy window — not sustained fabrication, which
      # overshoots the (deliberately generous) ceiling by orders of magnitude.
      # Read this before releasing anything: goo-rate is the core anti-cheat
      # signal, not a bound that was simply set too low.
      - name: Flagged-row detail for one account (optional)
        if: ${{ inputs.user_id != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          # Account ids are UUIDs; reject anything else so the value can't carry
          # a quote or a UNION into the SELECT below.
          if ! printf '%s' "$USER_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "user_id '$USER_ID' is not a valid account id (expected a UUID). Skipping detail."
            exit 0
          fi
          npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "
            SELECT a.created, a.elapsed_sec, a.goo_gain, a.max_gain, a.ratio,
                   a.click_gain, a.flags, u.display_name
            FROM save_audit a LEFT JOIN users u ON u.id = a.user_id
            WHERE a.user_id = '$USER_ID' AND a.ok = 0
            ORDER BY a.created DESC LIMIT 50;"

      # The tuning data: how far below the ceiling honest play sits. Buckets of
      # ratio = goo_gain / max_gain over CLEAN rows. A future threshold wants a
      # wide empty gap between the top honest bucket and 1.0.
      - name: Ratio distribution of clean writes (threshold-tuning data)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "
            SELECT CASE
                     WHEN ratio <= 0      THEN 'a: <=0 (idle/first)'
                     WHEN ratio < 0.0001  THEN 'b: <0.01%'
                     WHEN ratio < 0.001   THEN 'c: <0.1%'
                     WHEN ratio < 0.01    THEN 'd: <1%'
                     WHEN ratio < 0.1     THEN 'e: <10%'
                     WHEN ratio < 0.5     THEN 'f: <50%'
                     ELSE                      'g: >=50% (NEAR CEILING)'
                   END AS bucket, COUNT(*) AS writes
            FROM save_audit WHERE ok = 1 GROUP BY bucket ORDER BY bucket;"

      - name: Closest honest writes to the ceiling
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "
            SELECT a.user_id, u.display_name, a.ratio, a.elapsed_sec, a.created
            FROM save_audit a LEFT JOIN users u ON u.id = a.user_id
            WHERE a.ok = 1 AND a.ratio > 0
            ORDER BY a.ratio DESC LIMIT 10;"

      - name: Current board (top 10 by goo)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "
            SELECT name, goo, clicks, updated FROM scores ORDER BY goo DESC LIMIT 10;"

      - name: How to release a wrongly-barred account
        run: |
          echo "Judged a flagged account honest? Release it with:"
          echo "  npx wrangler d1 execute blorbo-leaderboard --remote --command \"DELETE FROM save_audit WHERE user_id = '<id>' AND ok = 0\""
          echo "Their row returns to the board on their next sync."
