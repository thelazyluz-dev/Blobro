name: Reset Leaderboard

# Deletes rows from the LIVE database. There is no undo and no backup.
#
# It exists because the alternative — pasting a DELETE statement into a
# terminal — is the same destructive act with less ceremony and no record of
# who ran it. Here every run is logged, and the typed confirmation means it
# cannot happen by tapping the wrong thing on a phone.
#
# What it does NOT touch: `saves`, `users`, `sessions`. Players keep their
# progress. Clearing `scores` empties the displayed table; a player's entry
# reappears with their real score the next time their game syncs. That is the
# intended behaviour for "clean slate before I send this to people" — it
# removes the test rows, not the players.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm (anything else aborts)'
        required: true
        default: ''
      include_audit:
        description: 'Also clear save_audit (the plausibility-audit trail)'
        type: boolean
        default: false

# The job only reads the repo; the GITHUB_TOKEN should not be able to do more
# than that even if something in the toolchain goes rogue.
permissions:
  contents: read

concurrency:
  group: reset-leaderboard
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      # First step, before anything is installed: a wrong confirmation should
      # cost nothing and reach no database. The input goes through an env var,
      # never interpolated into the script text — `${{ }}` inside `run:` is
      # the classic GitHub Actions injection shape.
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "Confirmation was '$CONFIRM', expected 'DELETE'. Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # Don't leave the GITHUB_TOKEN sitting in .git/config while npm ci
          # runs hundreds of packages' install scripts.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install worker toolchain
        working-directory: worker
        run: npm ci

      # Print the row counts before deleting. If the number is a surprise —
      # far more rows than expected, or zero — that shows up in the log next
      # to the deletion, which is the only forensics available afterwards.
      - name: Count rows before
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute blorbo-leaderboard --remote --yes \
            --command "SELECT (SELECT COUNT(*) FROM scores) AS scores, (SELECT COUNT(*) FROM save_audit) AS save_audit, (SELECT COUNT(*) FROM saves) AS saves_kept, (SELECT COUNT(*) FROM users) AS users_kept;"

      - name: Clear scores
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "DELETE FROM scores;"

      - name: Clear save_audit
        if: ${{ inputs.include_audit }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute blorbo-leaderboard --remote --yes --command "DELETE FROM save_audit;"

      - name: Count rows after
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute blorbo-leaderboard --remote --yes \
            --command "SELECT (SELECT COUNT(*) FROM scores) AS scores, (SELECT COUNT(*) FROM save_audit) AS save_audit, (SELECT COUNT(*) FROM saves) AS saves_kept, (SELECT COUNT(*) FROM users) AS users_kept;"

      # The leaderboard is the visible half of this; confirm it still answers
      # (empty is fine, broken is not).
      - name: Check the leaderboard still responds
        run: |
          code=$(curl -s -o /tmp/top.json -w '%{http_code}' 'https://api.bl-or-bo.com/top?by=goo')
          echo "GET /top -> $code"
          cat /tmp/top.json
          echo
          test "$code" = "200"
