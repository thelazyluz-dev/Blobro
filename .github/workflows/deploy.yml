name: Deploy to GitHub Pages

on:
  push:
    # Deploys from the repository's default branch. `main` is listed for when
    # the project moves there; the current default is claude/new-session-6f5k8n.
    branches: [main, claude/new-session-6f5k8n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NEVER cancel a Pages deploy mid-flight. Cancelling a run while
  # actions/deploy-pages is mid-deployment leaves that deployment stuck
  # "in_progress" server-side, and then EVERY later run's deploy-pages waits on
  # it and times out ("deployment_in_progress → Timeout reached, aborting!").
  # That was the cascade that failed runs #208–#211. Queue instead of cancel.
  cancel-in-progress: false

jobs:
  # Build AND deploy in ONE job. Previously these were split (build → deploy),
  # and the separate deploy job kept failing at "Getting action download info →
  # Service Unavailable" while resolving actions/deploy-pages — even though the
  # build job resolved all of ITS actions fine on the same run. Putting
  # deploy-pages in the same job resolves it in that working phase, and drops a
  # whole runner-provision + action-resolution round-trip.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Don't leave the GITHUB_TOKEN sitting in .git/config while npm ci
          # runs hundreds of packages' install scripts.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on (source = GitHub Actions) via the API on first run,
          # so no manual repo setting is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Sanity-check the live site in the SAME job. Previously this was a
      # separate `sanity` job, which meant a second runner + a second
      # action-resolution round-trip ("Set up job" → "Getting action download
      # info"). When GitHub's action-download service is degraded ("Failed to
      # resolve action download info / Service Unavailable"), every extra job is
      # another chance to fail on infra we don't control — so we keep the whole
      # workflow to ONE job and resolve actions exactly once.
      #
      # Give Pages a moment to actually serve the new deployment before hitting
      # it — deploy-pages can report success just ahead of propagation.
      - run: sleep 15
      - run: node scripts/sanity.mjs https://bl-or-bo.com
