<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1A0B2E" />
    <!-- The share/search description leads with the challenge hook the game is
         being distributed around (owner request) — the "no pop-up ads" line was
         pulled from the SHARE copy; the factual promise still lives in
         parents.html for parents who open it. -->
    <meta name="description" content="בלורבו — מי הראשון שיגיע לדציליון?" />
    <link rel="canonical" href="https://bl-or-bo.com/" />
    <!-- Share cards: a link pasted in WhatsApp/Facebook (where Israeli parents
         actually swap game recommendations) renders as a rich card, not a bare
         blue URL. og.png is generated brand art — no user data in it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="בלורבו" />
    <meta property="og:title" content="בלורבו — משחק חינמי בעברית לכל המשפחה" />
    <meta property="og:description" content="🏆 מי הראשון שיגיע לדציליון?" />
    <meta property="og:url" content="https://bl-or-bo.com/" />
    <meta property="og:image" content="https://bl-or-bo.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="בלורבו — משחק חינמי בעברית לכל המשפחה" />
    <meta name="twitter:image" content="https://bl-or-bo.com/og.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="בלורבו" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- Content Security Policy. GitHub Pages cannot set HTTP headers, so this
         goes in a meta tag — which means `frame-ancestors` is unavailable
         (meta-delivered CSP ignores it); everything else applies normally.

         `'unsafe-inline'` in script-src is NOT an oversight. The AdSense loader
         injects inline scripts and Google's own guidance is that ad serving
         requires it; a policy without it silently kills every ad. The app
         itself has no HTML-injection sink at all (no innerHTML, no
         dangerouslySetInnerHTML, no eval anywhere), so what this policy is
         really buying is the other directives: scripts and connections can only
         reach an allowlisted set of hosts, `object-src 'none'` kills plugin
         injection, and `base-uri 'self'` blocks <base> hijacking. That is
         defence in depth around a third-party script we cannot sandbox, not a
         replacement for not having sinks.

         IF ADS EVER STOP SHOWING, look here first: the browser console will say
         "Refused to load ... because it violates the following Content Security
         Policy directive". Deleting this one meta tag restores the old
         behaviour completely. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.google.com https://*.gstatic.com https://*.doubleclick.net https://ep2.adtrafficquality.google;
               connect-src 'self' https://api.bl-or-bo.com https://*.googlesyndication.com https://*.google.com https://*.doubleclick.net https://ep1.adtrafficquality.google;
               img-src 'self' data: blob: https:;
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               frame-src https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com;
               media-src 'self' blob: data:;
               worker-src 'self' blob:;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Google AdSense + H5 Games Ads (Ad Placement API: adConfig/adBreak).
         data-tag-for-age-treatment="1" marks every ad request as child-directed
         (TFAT=1, the replacement for the deprecated TFCD) — this disables
         interest-based/personalized ads, which is required for a kids' game. -->
    <script
      async
      data-ad-client="ca-pub-4684491615356401"
      data-tag-for-age-treatment="1"
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
      crossorigin="anonymous"
    ></script>
    <title>בלורבו</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
